[workspace]
members = ["crates/backend", "crates/migrate"]
resolver = "2"

[workspace.dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "migrate", "json"] }
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
thiserror = "1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opendal = { version = "0.59", default-features = false, features = ["services-s3", "services-fs", "reqwest-rustls-tls", "executors-tokio"] }
futures = "0.3"
image = "0.25"
sha2 = "0.10"
flate2 = "1"
crc32fast = "1"
