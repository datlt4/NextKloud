[package]
name = "nextkloud"
version = "0.1.50"
edition = "2021"
license = "MIT"

[lib]
name = "nextkloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# updater/process chỉ dùng trên desktop (app mobile cập nhật bằng bản cài mới)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
