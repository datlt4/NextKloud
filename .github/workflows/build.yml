name: build

# main -> :latest and :<version> (Docker Hub $DOCKERHUB_USERNAME/nextkloud).
# Desktop/mobile releases come with the release workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/desktop
      - name: Audit web dependencies (fail on high/critical)
        run: npm audit --audit-level=high
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/backend -> target
      - run: cargo test --locked -p nextkloud-backend

  # Test backend với Postgres + RustFS thật (test tự bỏ qua khi thiếu NK_TEST_DB/NK_TEST_S3).
  # Job riêng, không chặn build Docker. Credential dưới đây chỉ dùng trong CI, không phải secret.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nk, POSTGRES_PASSWORD: nk, POSTGRES_DB: nk }
        ports: ["15432:5432"]
        options: --health-cmd "pg_isready -U nk" --health-interval 5s --health-retries 20
      rustfs:
        image: rustfs/rustfs:1.0.4
        env: { RUSTFS_ACCESS_KEY: citest, RUSTFS_SECRET_KEY: citest-secret-123, RUSTFS_ADDRESS: ":9000", RUSTFS_VOLUMES: /data }
        ports: ["19000:9000"]
    steps:
      - uses: actions/checkout@v4
      - name: Create test bucket
        env: { AWS_ACCESS_KEY_ID: citest, AWS_SECRET_ACCESS_KEY: citest-secret-123, AWS_DEFAULT_REGION: us-east-1 }
        run: |
          for i in $(seq 1 30); do aws --endpoint-url http://127.0.0.1:19000 s3 mb s3://nktest && break; sleep 2; done
          aws --endpoint-url http://127.0.0.1:19000 s3 ls
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/backend -> target
      - run: cargo test --locked -p nextkloud-backend
        env:
          NK_TEST_DB: postgres://nk:nk@127.0.0.1:15432/nk
          NK_TEST_S3: http://127.0.0.1:19000,nktest,citest,citest-secret-123

  tauri-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: mkdir -p ../dist && cargo test
        working-directory: apps/desktop/src-tauri

  # Each architecture builds natively (arm64 under QEMU is slow), then one manifest joins them.
  docker:
    needs: check
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, os: ubuntu-latest }
          - { platform: linux/arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/nextkloud,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ strategy.job-index }}
          path: digests/*
          retention-days: 1

  docker-manifest:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digests-backend-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag the multi-arch image
        working-directory: digests
        run: |
          V=$(node -p "require('../apps/desktop/package.json').version")
          I=${{ secrets.DOCKERHUB_USERNAME }}/nextkloud
          docker buildx imagetools create -t $I:latest -t $I:$V $(printf "$I@sha256:%s " *)
          docker buildx imagetools inspect $I:latest

  # Chỉ build lại image TTS khi docker/tts đổi: bớt push/pull Docker Hub (tránh 429).
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tts: ${{ steps.f.outputs.tts }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tts:
              - 'docker/tts/**'

  # TTS voice service (edge-tts + LibreTranslate detect). Same flow, own image.
  tts:
    needs: [check, changes]
    if: github.event_name == 'push' && needs.changes.outputs.tts == 'true'
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, os: ubuntu-latest }
          - { platform: linux/arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tts/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/nextkloud-tts,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tts-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=tts-${{ matrix.platform }}
      - run: mkdir -p digests-tts && touch "digests-tts/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-tts-${{ strategy.job-index }}
          path: digests-tts/*
          retention-days: 1

  tts-manifest:
    needs: tts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: digests-tts
          pattern: digests-tts-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag the multi-arch image
        working-directory: digests-tts
        run: |
          V=$(node -p "require('../apps/desktop/package.json').version")
          I=${{ secrets.DOCKERHUB_USERNAME }}/nextkloud-tts
          docker buildx imagetools create -t $I:latest -t $I:$V $(printf "$I@sha256:%s " *)
          docker buildx imagetools inspect $I:latest
