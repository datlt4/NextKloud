name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable@v1
        with:
          toolchain: stable
      - run: cargo test -p nextkloud-backend
      - run: cargo build --release -p nextkloud-backend

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm run build

  # Tauri desktop/mobile matrix (tham khảo Kermius/Kellyfin: tách job theo OS).
  # Kích hoạt dần ở M3 để tránh CI quá nặng.
  tauri:
    if: contains(github.event.head_commit.message, '[tauri]')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: apps/desktop
      - uses: tauri-apps/tauri-action@v0
