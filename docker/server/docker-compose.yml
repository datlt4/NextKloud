services:
  backend:
    # Image do CI build/push (build.yml). Trên mini PC chỉ pull, không build local.
    # Muốn build local: mở comment khối build bên dưới (cần checkout repo).
    image: "${NEXTKLOUD_IMAGE:?set NEXTKLOUD_IMAGE=<dockerhub_user>/nextkloud, vd export NEXTKLOUD_IMAGE=hienanh/nextkloud}"
    # Chạy bằng UID/GID của chính bạn: app không yêu cầu owner cụ thể,
    # chown folder disk thoải mái cũng không khóa app (khác Nextcloud).
    user: "${PUID:-1000}:${PGID:-1000}"
    #build:
    #  context: ../..
    #  dockerfile: docker/server/Dockerfile
    restart: unless-stopped
    ports:
      - "8011:8014" # NextKloud trên mini PC: http://<mini-pc>:8011
    environment:
      - BIND=0.0.0.0:8014
      - DATABASE_URL=postgres://nextkloud:nextkloud@db:5432/nextkloud
      - REDIS_URL=redis://cache:6379
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-change-me}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - STORAGE_DRIVER=s3 # fs | s3 (abstraction OpenDAL)
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=nextkloud
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      # Dùng OnlyOffice sẵn có trên mini PC (port 8027), không chạy thêm.
      - ONLYOFFICE_URL=http://host.docker.internal:8027
      - ALLOWED_ORIGINS=*
      # Không có TRUSTED_DOMAINS — cố tình bỏ giống yêu cầu (khác Nextcloud).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /mnt/das_8tb/nextkloud_volume/app:/data
    depends_on:
      - db
      - cache
      - minio

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - /mnt/das_8tb/nextkloud_volume/pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=nextkloud
      - POSTGRES_PASSWORD=nextkloud
      - POSTGRES_DB=nextkloud

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /mnt/das_8tb/nextkloud_volume/redis:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  # TTS giọng đọc: edge-tts (Microsoft Neural, miễn phí) + detect EN/VI/ZH
  # bằng LibreTranslate sẵn có trên mini PC (:8015).
  tts:
    image: "${NEXTKLOUD_TTS_IMAGE:?set NEXTKLOUD_TTS_IMAGE=<dockerhub_user>/nextkloud-tts}:latest"
    container_name: nextkloud-tts
    restart: unless-stopped
    ports:
      - "8016:8016"
    environment:
      - LIBRETRANSLATE_URL=http://host.docker.internal:8015
      - TTS_RATE=+0%
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /mnt/das_8tb/nextkloud_volume/tts:/data

  # MinIO community: minio/minio gốc đã rời Docker Hub + Quay chặn anon pull.
  # Dùng bản rebuild cộng đồng pgsty/minio (S3 API tương thích).
  minio:
    image: pgsty/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123 # >= 8 ký tự, đổi khi deploy thật
    volumes:
      - /mnt/das_8tb/nextkloud_volume/s3:/data
    command: server /data --console-address ":9001"

  # TẠM GỠ onlyoffice: mini PC đã có onlyoffice-documentserver ở port 8027.
  # Backend trỏ qua ONLYOFFICE_URL=http://host.docker.internal:8027.
  #onlyoffice:
  #  image: onlyoffice/documentserver:latest
  #  restart: unless-stopped
  #  ports:
  #    - "8015:80"
  #  environment:
  #    - JWT_ENABLED=false # bật JWT khi ra production
