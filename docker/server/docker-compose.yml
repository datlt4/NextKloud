services:
  backend:
    # Image do CI build/push (build.yml). Trên mini PC chỉ pull, không build local.
    # Muốn build local: mở comment khối build bên dưới (cần checkout repo).
    image: "${NEXTKLOUD_IMAGE:?set NEXTKLOUD_IMAGE=<dockerhub_user>/nextkloud, vd export NEXTKLOUD_IMAGE=hienanh/nextkloud}"
    # Chạy bằng UID/GID của chính bạn: app không yêu cầu owner cụ thể,
    # chown folder disk thoải mái cũng không khóa app (khác Nextcloud).
    user: "${PUID:-1000}:${PGID:-1000}"
    #build:
    #  context: ../..
    #  dockerfile: docker/server/Dockerfile
    restart: unless-stopped
    ports:
      - "8011:8014" # NextKloud trên mini PC: http://<mini-pc>:8011
    environment:
      - BIND=0.0.0.0:8014
      - DATABASE_URL=postgres://nextkloud:nextkloud@db:5432/nextkloud
      - REDIS_URL=redis://cache:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=nextkloud
      - STORAGE_DRIVER=s3 # fs | s3 (đổi bằng env, abstraction OpenDAL)
      - ALLOWED_ORIGINS=*
      # Không có TRUSTED_DOMAINS — cố tình bỏ giống yêu cầu (khác Nextcloud).
    depends_on:
      - db
      - cache
      - minio

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - /mnt/das_8tb/nextkloud_volume/pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=nextkloud
      - POSTGRES_PASSWORD=nextkloud
      - POSTGRES_DB=nextkloud

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /mnt/das_8tb/nextkloud_volume/redis:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /mnt/das_8tb/nextkloud_volume/s3:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"

  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    ports:
      - "8015:80"
    environment:
      - JWT_ENABLED=false # bật JWT khi ra production
