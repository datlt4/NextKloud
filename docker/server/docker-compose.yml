services:
  backend:
    build: ../..
    dockerfile: docker/server/Dockerfile
    restart: unless-stopped
    ports:
      - "8014:8014"
    environment:
      - BIND=0.0.0.0:8014
      - DATABASE_URL=postgres://nextkloud:nextkloud@db:5432/nextkloud
      - REDIS_URL=redis://cache:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=nextkloud
      - STORAGE_DRIVER=s3 # fs | s3 (đổi bằng env, abstraction OpenDAL)
      - ALLOWED_ORIGINS=*
      # Không có TRUSTED_DOMAINS — cố tình bỏ giống yêu cầu (khác Nextcloud).
    depends_on:
      - db
      - cache
      - minio

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - /home/mini/Software/NextKloud/pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=nextkloud
      - POSTGRES_PASSWORD=nextkloud
      - POSTGRES_DB=nextkloud

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /home/mini/Software/NextKloud/redis:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /home/mini/Software/NextKloud/s3:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"

  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    ports:
      - "8015:80"
    environment:
      - JWT_ENABLED=false # bật JWT khi ra production
